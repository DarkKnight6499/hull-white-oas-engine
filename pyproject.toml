[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hull-white-oas-engine"
version = "0.1.0"
description = "Hull-White calibration, callable bond and mortgage OAS analytics"
readme = "README.md"

requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "pandas>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]
